<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Détail - AMNA LEUP</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f5}header{background:white;padding:12px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 5px #0002;position:sticky;top:0;z-index:10}.img-box{background:white;padding:10px}.img-box img{width:100%;border-radius:15px;max-height:400px;object-fit:cover}.info{background:white;margin:10px;border-radius:15px;padding:15px}.prix{color:#0a7a42;font-size:26px;font-weight:bold}.vendeur{background:#fff0f0;border:2px solid red;border-radius:15px;padding:15px;margin:10px}.btn-wa{background:#25D366;color:white;width:92%;margin:10px 4%;padding:16px;border:none;border-radius:30px;font-size:18px;font-weight:bold}</style></head>
<body>
<header><a href="index.html" style="text-decoration:none;color:#000;font-weight:bold;font-size:20px">← Retour</a><b>AMNA LEUP SN</b></header>
<div class="img-box"><img id="photo" src="logo.jpg"></div>
<div class="info"><h2 id="nom">Chargement...</h2><p class="prix" id="prix">0 FCFA</p><p id="desc" style="margin-top:8px;color:#333"></p></div>
<div class="vendeur"><h3 style="color:red">📍 Infos Vendeur</h3><p>👤 <b id="vNom">...</b></p><p>📞 <b id="vTel">+221 75 456 09 85</b></p><p>🏠 <b>Adresse:</b> <span id="vAdr">Guédiawaye</span></p><p>🏙️ <b>Ville:</b> <span id="vVille">Guédiawaye</span></p></div>
<button class="btn-wa" onclick="commander()">COMMANDER SUR WHATSAPP 📱</button>
<script>
let p = JSON.parse(localStorage.getItem('produitActuel') || localStorage.getItem('selectedProduit') || '{}');
if(p){
 document.getElementById('photo').src = p.photo || p.img || 'logo.jpg';
 document.getElementById('nom').innerText = p.nom || p.name || 'Produit';
 document.getElementById('prix').innerText = (p.prix || p.price || '0').toString().replace('F','') + ' FCFA';
 document.getElementById('desc').innerText = p.desc || p.nom || p.name || '';
 document.getElementById('vNom').innerText = p.vendeur || p.seller || 'AMNA LEUP';
 document.getElementById('vTel').innerText = p.tel || p.vendeur || '+221 75 456 09 85';
 document.getElementById('vAdr').innerText = p.adresse || p.quartier || 'Guédiawaye, Dakar';
 document.getElementById('vVille').innerText = p.ville || p.quartier || 'Guédiawaye';
}
function commander(){
 let nom=document.getElementById('nom').innerText;
 let prix=document.getElementById('prix').innerText;
 let adr=document.getElementById('vAdr').innerText;
 let msg=`Salam AMNA LEUP!%0AJe veux:%0A📦 ${nom}%0A💰 ${prix}%0A🏠 Vendeur: ${adr}%0A%0AMon adresse:`;
 window.open('https://wa.me/221754560985?text='+msg,'_blank');
}
</script></body></html>
