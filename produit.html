<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Détail Produit - AMNA LEUP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5}
header{background:white;padding:10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 5px #0002}
header a{text-decoration:none;color:black;font-size:20px;font-weight:bold}
.img-box{background:white;padding:10px}
.img-box img{width:100%;border-radius:15px;max-height:350px;object-fit:cover}
.info{background:white;margin:10px;border-radius:15px;padding:15px}
.prix{color:#0a7a42;font-size:24px;font-weight:bold}
.vendeur{background:#fff3f3;border:2px solid red;border-radius:15px;padding:15px;margin:10px}
.vendeur h3{color:red}
.btn-whatsapp{background:#25D366;color:white;width:100%;padding:15px;border:none;border-radius:30px;font-size:18px;font-weight:bold;margin-top:10px}
</style>
</head>
<body>
<header><a href="index.html">← Retour</a> <b>AMNA LEUP</b></header>

<div class="img-box"><img id="photo" src="logo.jpg"></div>

<div class="info">
<h2 id="nom">Nom du produit</h2>
<p class="prix" id="prix">0 FCFA</p>
<p id="desc">Description du produit ici...</p>
</div>

<div class="vendeur">
<h3>📍 Infos Vendeur</h3>
<p>👤 <b>Nom:</b> <span id="vNom">Cheikh - AMNA LEUP</span></p>
<p>📞 <b>Téléphone:</b> <span id="vTel">+221 75 456 09 85</span></p>
<p>🏠 <b>Adresse:</b> <span id="vAdr">Guédiawaye, Dakar, Sénégal</span></p>
<p>🏙️ <b>Ville:</b> <span id="vVille">Guédiawaye</span></p>
</div>

<button class="btn-whatsapp" onclick="commander()">COMMANDER SUR WHATSAPP 📱</button>

<script>
// Récupère les infos du produit cliqué
let produit = JSON.parse(localStorage.getItem('produitActuel'));
if(produit){
 document.getElementById('photo').src = produit.photo;
 document.getElementById('nom').innerText = produit.nom;
 document.getElementById('prix').innerText = produit.prix + ' FCFA';
 document.getElementById('desc').innerText = produit.desc;
 if(produit.vendeur) document.getElementById('vNom').innerText = produit.vendeur;
 if(produit.tel) document.getElementById('vTel').innerText = produit.tel;
 if(produit.adresse) document.getElementById('vAdr').innerText = produit.adresse;
}

function commander(){
 let nom = document.getElementById('nom').innerText;
 let prix = document.getElementById('prix').innerText;
 let adrV = document.getElementById('vAdr').innerText;
 let telV = document.getElementById('vTel').innerText;
 let msg = `Salam AMNA LEUP!%0AJe veux:%0A📦 ${nom}%0A💰 ${prix}%0A🏠 Vendeur: ${adrV}%0A📞 Vendeur: ${telV}%0A%0AMon adresse:`;
 window.open(`https://wa.me/221754560985?text=${msg}`,'_blank');
}
</script>
</body>
</html>
